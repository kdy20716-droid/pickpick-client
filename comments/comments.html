<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./comments.css" />
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <!-- 헤더 -->
    <div id="header-root"></div>

    <!-- 댓글  -->
    <div class="modal">
      <div class="modal-header">
        <span>댓글 133</span>
        <button class="close">×</button>
      </div>

      <div class="comment-list">
        <!-- 댓글 1 -->
        <div class="comment">
          <div class="avatar"></div>
          <div class="content">
            <div class="top">
              <span class="name">지존 지훈</span>
              <span class="menu">⋯</span>
            </div>
            <p>1빠</p>
            <div class="actions">
              <span>👍 54</span>
              <span>💬</span>
            </div>
          </div>
        </div>

        <!-- 댓글 2 -->
        <div class="comment">
          <div class="avatar"></div>
          <div class="content">
            <div class="top">
              <span class="name">어그로꾼</span>
              <span class="menu">⋯</span>
            </div>
            <p>얘들아 내가 재밌는 얘기 해줄게...더보기</p>
            <div class="actions">
              <span>👍 128</span>
              <span>💬 3</span>
            </div>
            <div class="reply">답글 3개</div>
          </div>
        </div>

        <!-- 댓글 3 -->
        <div class="comment">
          <div class="avatar"></div>
          <div class="content">
            <div class="top">
              <span class="name">차미새</span>
              <span class="menu">⋯</span>
            </div>
            <p>o(*≧▽≦)ツ</p>
            <div class="actions">
              <span>👍 234</span>
              <span>💬 19</span>
            </div>
            <div class="reply">답글 19개</div>
          </div>
        </div>

        <!-- 댓글 4 -->
        <div class="comment">
          <div class="avatar"></div>
          <div class="content">
            <div class="top">
              <span class="name">익명</span>
              <span class="menu">⋯</span>
            </div>
            <p>＼(((￣▽￣)))／</p>
            <div class="actions">
              <span>👍 2</span>
              <span>💬 43</span>
            </div>
            <div class="reply">답글 43개</div>
          </div>
        </div>
      </div>

      <!-- 댓글 입력 -->
      <div class="comment-input">
        <div class="avatar small"></div>
        <input type="text" placeholder="댓글 추가..." />
      </div>
    </div>
    <script type="text/babel" src="comments.js"></script>
  </body>
</html>
