<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ranking</title>
    <link rel="stylesheet" href="./ranking.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="navbar">
      <div class="nav-container">
        <div class="logo">PICK PICK</div>
        <nav class="nav-menu">
          <a href="#" class="active">홈</a>
          <a href="#">투표하기</a>
          <a href="#">랭킹</a>
          <a href="#">마이페이지</a>
        </nav>
      </div>
    </header>

    <section class="ranking-section">
      <!-- 🔥 TOP 3 -->
      <div class="top3">
        <!-- 2등 -->
        <div class="rank-card second">
          <img
            src="./assets/2위메달.png"
            class="medal"
            alt="silver medal"
          />

          <div class="card">
            <img src="./assets/사초.png" class="img top" alt="character 1" />
            <img src="./assets/vs.png" class="vs" alt="vs" />
            <img
              src="./assets/외노자.png"
              class="img bottom"
              alt="character 2"
            />
          </div>
        </div>

        <!-- 1등 -->
        <div class="rank-card first">
          <img src="./assets/1위 메달.png" class="medal" alt="gold medal" />

          <div class="card big">
            <img
              src="./assets/외노자.png"
              class="img top"
              alt="character 1"
            />
            <img src="./assets/vs.png" class="vs" alt="vs" />
            <img
              src="./assets/사초.png"
              class="img bottom"
              alt="character 2"
            />
          </div>
        </div>

        <!-- 3등 -->
        <div class="rank-card third">
          <img
            src="./assets/3위 메달.png"
            class="medal"
            alt="bronze medal"
          />

          <div class="card">
            <img src="./assets/사초.png" class="img top" alt="character 1" />
            <img src="./assets/vs.png" class="vs" alt="vs" />
            <img
              src="./assets/외노자.png"
              class="img bottom"
              alt="character 2"
            />
          </div>
        </div>
      </div>

      <!-- 🔥 리스트 -->
      <div class="ranking-list">
        <div class="item">
          <div class="num">4</div>

          <div class="vs-row">
            <img src="./assets/사초.png" alt="character 1" />
            <img src="./assets/vs.png" class="vs-small" alt="vs" />
            <img src="./assets/외노자.png" alt="character 2" />
          </div>

          <div class="title">투표 제목</div>
        </div>

        <div class="item">
          <div class="num">5</div>

          <div class="vs-row">
            <img src="./assets/외노자.png" alt="character 2" />
            <img src="./assets/vs.png" class="vs-small" alt="vs" />
            <img src="./assets/사초.png" alt="character 1" />
          </div>

          <div class="title">투표 제목</div>
        </div>
      </div>
    </section>
    <script src="./ranking.js"></script>
  </body>
</html>
