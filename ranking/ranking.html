<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ranking</title>
    <link rel="stylesheet" href="./ranking.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="nav-container">
        <div class="logo">PICK PICK</div>
        <nav class="nav-links">
          <a href="#" class="active">홈</a>
          <a href="#">투표하기</a>
          <a href="#">랭킹</a>
          <a href="#">마이페이지</a>
        </nav>
      </div>
    </header>

    <section class="ranking-section">
      <div class="top3">
        <div class="rank-card second">
          <img src="./assets/2위메달.png" class="medal" alt="silver medal" />

          <div class="card">
            <img src="./assets/사초.png" class="img top" alt="character 1" />
            <img src="./assets/vs.png" class="vs" alt="vs" />
            <img
              src="./assets/외노자.png"
              class="img bottom"
              alt="character 2"
            />
          </div>
          <div class="vote-title">오늘의 밸런스 게임</div>
        </div>

        <div class="rank-card first">
          <img src="./assets/1위 메달.png" class="medal" alt="gold medal" />

          <div class="card big">
            <img src="./assets/외노자.png" class="img top" alt="character 1" />
            <img src="./assets/vs.png" class="vs" alt="vs" />
            <img src="./assets/사초.png" class="img bottom" alt="character 2" />
          </div>
          <div class="vote-title">직장인 최애 점심 메뉴</div>
        </div>

        <div class="rank-card third">
          <img src="./assets/3위 메달.png" class="medal" alt="bronze medal" />

          <div class="card">
            <img src="./assets/사초.png" class="img top" alt="character 1" />
            <img src="./assets/vs.png" class="vs" alt="vs" />
            <img
              src="./assets/외노자.png"
              class="img bottom"
              alt="character 2"
            />
          </div>
          <div class="vote-title">주말 집콕 vs 외출</div>
        </div>
      </div>

      <div class="ranking-list">
        <div class="item">
          <div class="num">4</div>

          <div class="vs-row">
            <img src="./assets/사초.png" alt="character 1" />
            <img src="./assets/vs.png" class="vs-small" alt="vs" />
            <img src="./assets/외노자.png" alt="character 2" />
          </div>

          <div class="title">야식으로 떡볶이 vs 치킨</div>
        </div>

        <div class="item">
          <div class="num">5</div>

          <div class="vs-row">
            <img src="./assets/외노자.png" alt="character 2" />
            <img src="./assets/vs.png" class="vs-small" alt="vs" />
            <img src="./assets/사초.png" alt="character 1" />
          </div>

          <div class="title">아침형 인간 vs 올빼미형 인간</div>
        </div>

        <div class="item">
          <div class="num">6</div>

          <div class="vs-row">
            <img src="./assets/사초.png" alt="character 1" />
            <img src="./assets/vs.png" class="vs-small" alt="vs" />
            <img src="./assets/외노자.png" alt="character 2" />
          </div>

          <div class="title">여행은 계획형 vs 즉흥형</div>
        </div>
      </div>
    </section>
    <script src="./ranking.js"></script>
  </body>
</html>
