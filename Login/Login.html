<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>PickPick Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="login-box">
        <h1>PICKPICK</h1>

        <form id="loginForm">
          <!-- 아이디 -->
          <div class="input-group">
            <input type="text" id="username" required />
            <label>PickPick 계정</label>
          </div>

          <!-- 비밀번호 -->
          <div class="input-group">
            <input type="password" id="password" required />
            <label>비밀번호</label>
          </div>

          <!-- 자동 로그인 -->
          <div class="auto-login">
            <input type="checkbox" id="auto" />
            <label for="auto">자동 로그인</label>
          </div>

          <!-- 로그인 버튼 -->
          <button type="submit">Login</button>

          <!-- 비밀번호 찾기 -->
          <div class="forgot">
            <a href="#">비밀번호를 잊으셨습니까?</a>
          </div>
        </form>

        <!-- 메시지 -->
        <p id="message"></p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
